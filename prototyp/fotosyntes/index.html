<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/MotionPathPlugin.min.js"></script>
    <style>
      /* Läxmotorn · förklaringsfilm "Fotosyntes" (provfilm).
         Lugn, saklig stil: en bild som växer fram del för del när rösten säger den,
         inzoomning i bladet, ingen musik (koherensprincipen). */
      :root {
        --sky1: #dceef7; --sky2: #f7f3e6;
        --soil1: #9c6b45; --soil2: #6e4429; --soil3: #4e2e1b;
        --leaf1: #6cbf5a; --leaf2: #2f8a3e; --leaf3: #1e5e2b;
        --sun1: #ffe27a; --sun2: #f6b31b;
        --water: #2f8fd8; --waterL: #9fd0f3;
        --co2: #4a4f57; --o: #e0523f;
        --sugar: #f09a2b;
        --ink: #1b2430; --paper: #fbfaf5; --muted: #6a7480;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--sky2); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Nunito", sans-serif; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #world { transform-origin: 0 0; }
      .pill {
        position: absolute; transform: translate(-50%, -50%);
        background: #ffffff; color: var(--ink); border: 4px solid var(--ink); border-radius: 999px;
        padding: 10px 30px 12px; font-weight: 800; font-size: 46px; line-height: 1; white-space: nowrap;
        box-shadow: 0 6px 0 rgba(27,36,48,.18);
      }
      .pill i { font-style: normal; display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-right: 14px; vertical-align: 2px; }
      .big { font-weight: 900; color: var(--ink); line-height: 1.05; }
      #title { position: absolute; left: 110px; top: 92px; font-size: 104px; letter-spacing: -0.02em; }
      #title span { display: inline-block; }
      .cap { position: absolute; font-weight: 800; font-size: 50px; color: var(--ink); white-space: nowrap; }
      .eq { position: absolute; left: 50%; top: 560px; transform: translateX(-50%); display: flex; align-items: center; gap: 26px; }
      .tok { display: flex; flex-direction: column; align-items: center; gap: 12px; font-weight: 800; font-size: 48px; color: var(--ink); }
      .tok svg { width: 180px; height: 180px; }
      .op { font-weight: 900; font-size: 84px; color: var(--muted); margin-bottom: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080">
      <audio id="vo" class="clip" src="assets/voice.wav" data-start="0.6" data-duration="32.6" data-volume="1"></audio>

      <!-- ============ VÄRLDEN: himmel, mark, växt, sol, vatten, barn ============ -->
      <div id="worldClip" class="clip layer" data-start="0" data-duration="36">
        <div id="world" class="full">
          <svg class="full" viewBox="0 0 1920 1080">
            <defs>
              <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe7f4"/><stop offset="1" stop-color="#f6f1e2"/></linearGradient>
              <linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a57249"/><stop offset=".45" stop-color="#7a4b2d"/><stop offset="1" stop-color="#4f2e1b"/></linearGradient>
              <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd46f"/><stop offset=".55" stop-color="#4ea84a"/><stop offset="1" stop-color="#2b7c39"/></linearGradient>
              <linearGradient id="gStem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f9145"/><stop offset=".5" stop-color="#5fb556"/><stop offset="1" stop-color="#2f7a38"/></linearGradient>

            </defs>
            <rect width="1920" height="1080" fill="url(#gSky)"/>

            <path id="soil" d="M0 760 C 320 742 640 776 960 760 S 1600 744 1920 762 V1080 H0 Z" fill="url(#gSoil)"/>
            <path d="M0 760 C 320 742 640 776 960 760 S 1600 744 1920 762" fill="none" stroke="#5a3a22" stroke-width="5"/>

              <path class="drop" d="M1330 990c0 0 -12 15 -12 23a12 12 0 0 0 24 0c0-8-12-23-12-23z"/>
            </g>
            <!-- rötter -->
            <g id="roots" opacity="0" fill="none" stroke="#e9dcc4" stroke-linecap="round" stroke-linejoin="round">
              <path class="root" stroke-width="12" d="M1180 762 C 1176 830 1188 880 1170 960"/>

            </g>
            <!-- solens sken och sol -->

              <circle r="300" fill="url(#gGlow)"/>

                <line x1="106" y1="106" x2="134" y2="134"/><line x1="-106" y1="-106" x2="-134" y2="-134"/><line x1="106" y1="-106" x2="134" y2="-134"/><line x1="-106" y1="106" x2="-134" y2="134"/>
              </g>
              <circle r="118" fill="url(#gSun)" stroke="#e7a213" stroke-width="6"/>
            </g></g>
            <!-- ljusstrålar mot bladen -->
            <g id="beams" opacity="0" fill="none" stroke="#f8c53a" stroke-width="10" stroke-linecap="round">
              <path class="beam" d="M470 330 L 1010 520"/>
              <path class="beam" d="M480 270 L 1090 380"/>
              <path class="beam" d="M470 210 L 1270 330"/>
            </g>
            <!-- växten -->
            <g id="plant">
              <path id="stem" d="M1180 762 C 1176 660 1188 540 1182 420 C 1180 380 1182 350 1184 318" fill="none" stroke="url(#gStem)" stroke-width="22" stroke-linecap="round"/>
              <g id="leafL1" transform="translate(1180 600)"><path d="M0 0 C -60 -70 -190 -80 -250 -20 C -190 40 -70 50 0 0 Z" fill="url(#gLeaf)" stroke="#2b6e35" stroke-width="5"/><path d="M0 0 C -80 -12 -160 -18 -240 -20" fill="none" stroke="#2b6e35" stroke-width="4"/></g>
              <g id="leafR1" transform="translate(1182 520)"><path d="M0 0 C 60 -70 190 -80 250 -20 C 190 40 70 50 0 0 Z" fill="url(#gLeaf)" stroke="#2b6e35" stroke-width="5"/><path d="M0 0 C 80 -12 160 -18 240 -20" fill="none" stroke="#2b6e35" stroke-width="4"/></g>
              <g id="leafL2" transform="translate(1183 410)"><path d="M0 0 C -50 -60 -160 -66 -210 -16 C -160 34 -60 40 0 0 Z" fill="url(#gLeaf)" stroke="#2b6e35" stroke-width="5"/><path d="M0 0 C -70 -10 -140 -14 -200 -16" fill="none" stroke="#2b6e35" stroke-width="4"/></g>
              <g id="leafR2" transform="translate(1184 330)"><path d="M0 0 C 50 -60 170 -66 220 -16 C 170 34 60 40 0 0 Z" fill="url(#gLeaf)" stroke="#2b6e35" stroke-width="5"/><path d="M0 0 C 70 -10 145 -14 210 -16" fill="none" stroke="#2b6e35" stroke-width="4"/></g>
              <ellipse id="leafGlow" cx="1190" cy="440" rx="330" ry="230" fill="url(#gLeafGlow)" opacity="0"/>
            </g>
            <!-- vatten som stiger: banor -->
            <path id="wpath1" d="M930 930 C 1010 935 1130 930 1172 900 C 1176 860 1180 800 1180 760 C 1180 640 1184 520 1182 420 C 1240 380 1320 350 1390 316" fill="none" stroke="none"/>
            <path id="wpath2" d="M1440 905 C 1380 920 1230 950 1176 930 C 1178 860 1180 800 1180 760 C 1180 660 1180 600 1180 600 C 1100 590 1020 590 960 580" fill="none" stroke="none"/>
            <g id="wdots" fill="var(--water)">
              <circle class="wd" r="11"/><circle class="wd" r="11"/><circle class="wd" r="11"/><circle class="wd" r="11"/><circle class="wd" r="11"/><circle class="wd" r="11"/>
            </g>
            <!-- syre som lämnar bladen -->
            <g id="o2s">
              <g class="o2"><circle cx="-18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/><circle cx="18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/></g>
              <g class="o2"><circle cx="-18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/><circle cx="18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/></g>
              <g class="o2"><circle cx="-18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/><circle cx="18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/></g>
              <g class="o2"><circle cx="-18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/><circle cx="18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/></g>
              <g class="o2"><circle cx="-18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/><circle cx="18" r="19" fill="var(--o)" stroke="#9e2c1e" stroke-width="3"/></g>
            </g>
            <path id="opath1" d="M1400 300 C 1500 280 1540 470 1630 535" fill="none" stroke="none"/>
            <path id="opath2" d="M1380 360 C 1470 420 1540 500 1630 540" fill="none" stroke="none"/>
            <path id="opath3" d="M1360 250 C 1480 230 1560 440 1630 530" fill="none" stroke="none"/>
            <!-- barnet som andas -->
            <g transform="translate(1700 420)"><g id="kid">
              <path d="M-40 360 C -40 250 -10 210 40 200 C 100 210 130 250 130 360 Z" fill="#5b7fc2" stroke="var(--ink)" stroke-width="5"/>
              <circle cx="40" cy="110" r="88" fill="#f2c9a0" stroke="var(--ink)" stroke-width="5"/>
              <path d="M-46 92 C -40 30 10 10 50 14 C 100 18 130 50 128 96 C 100 70 40 64 -46 92 Z" fill="#7a4b2d" stroke="var(--ink)" stroke-width="5"/>
              <path d="M-46 118 l -20 14 l 22 4" fill="#f2c9a0" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
              <circle cx="0" cy="104" r="7" fill="var(--ink)"/>
              <path d="M-18 150 C -6 158 6 158 14 152" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            </g></g>
          </svg>
          <!-- etiketter i världen -->
          <div id="labLjus" class="pill" style="left:760px; top:300px"><i style="background:#f6b31b"></i>Ljus</div>
          <div id="labVatten" class="pill" style="left:790px; top:930px"><i style="background:var(--water)"></i>Vatten</div>
          <div id="labSyre" class="pill" style="left:1560px; top:200px"><i style="background:var(--o)"></i>Syre</div>
        </div>
        <div id="title" class="big"><span>Foto</span><span>syntes</span></div>
      </div>

      <!-- ============ NÄRBILD: bladets yta och ett litet hål ============ -->
      <div id="closeClip" class="clip layer" data-start="9.8" data-duration="6.4">
        <div id="close" class="full" style="opacity:0">
          <svg class="full" viewBox="0 0 1920 1080">
            <defs>
              <radialGradient id="gCell" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#9ad97c"/><stop offset="1" stop-color="#4f9e45"/></radialGradient>
            </defs>
            <rect width="1920" height="1080" fill="#3a8238"/>
            <g id="cells"></g>
            <rect width="1920" height="1080" fill="#1e4d22" opacity=".18"/>

            <g id="stoma" transform="translate(1180 560)">
              <ellipse rx="230" ry="300" fill="#1c3f1f" opacity=".25"/>

              <g id="guardR"><path d="M10 -250 C 190 -240 230 -60 230 0 C 230 60 190 240 10 250 C 70 160 80 60 80 0 C 80 -60 70 -160 10 -250 Z" fill="#7ccf63" stroke="#245c26" stroke-width="8"/></g>
              <ellipse id="pore" rx="10" ry="200" fill="#0f2611"/>
            </g>
            <!-- koldioxid -->
            <g id="co2s">
              <g class="co2"><line x1="-36" x2="36" stroke="#2c2f35" stroke-width="10"/><circle cx="-40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/><circle r="30" fill="var(--co2)" stroke="#23262b" stroke-width="4"/><circle cx="40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/></g>
              <g class="co2"><line x1="-36" x2="36" stroke="#2c2f35" stroke-width="10"/><circle cx="-40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/><circle r="30" fill="var(--co2)" stroke="#23262b" stroke-width="4"/><circle cx="40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/></g>
              <g class="co2"><line x1="-36" x2="36" stroke="#2c2f35" stroke-width="10"/><circle cx="-40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/><circle r="30" fill="var(--co2)" stroke="#23262b" stroke-width="4"/><circle cx="40" r="26" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/></g>
            </g>
          </svg>
          <div id="labHal" class="pill" style="left:1180px; top:180px">Litet hål i bladet</div>
          <div id="labCo2" class="pill" style="left:420px; top:300px"><i style="background:var(--co2)"></i>Koldioxid</div>
        </div>
      </div>

      <!-- ============ I BLADET: ljus + vatten + koldioxid blir socker ============ -->
      <div id="factClip" class="clip layer" data-start="15.2" data-duration="8.6">
        <div id="fact" class="full" style="opacity:0; background: radial-gradient(ellipse at 50% 45%, #eaf6dc 0%, #cfe8b8 70%, #b5d99a 100%)">
          <svg class="full" viewBox="0 0 1920 1080">
            <!-- kloroplasten: växtens kök -->
            <g id="chloro" transform="translate(960 470)">
              <ellipse rx="330" ry="190" fill="#7cc865" stroke="#2d6e2f" stroke-width="10"/>
              <ellipse rx="300" ry="162" fill="none" stroke="#a6dc8e" stroke-width="6"/>
              <g fill="#3f9a3f" stroke="#2a6a2c" stroke-width="5">
                <g transform="translate(-170 0)"><rect x="-38" y="-62" width="76" height="22" rx="11"/><rect x="-38" y="-34" width="76" height="22" rx="11"/><rect x="-38" y="-6" width="76" height="22" rx="11"/><rect x="-38" y="22" width="76" height="22" rx="11"/></g>
                <g transform="translate(0 -20)"><rect x="-38" y="-62" width="76" height="22" rx="11"/><rect x="-38" y="-34" width="76" height="22" rx="11"/><rect x="-38" y="-6" width="76" height="22" rx="11"/><rect x="-38" y="22" width="76" height="22" rx="11"/></g>
                <g transform="translate(170 10)"><rect x="-38" y="-62" width="76" height="22" rx="11"/><rect x="-38" y="-34" width="76" height="22" rx="11"/><rect x="-38" y="-6" width="76" height="22" rx="11"/><rect x="-38" y="22" width="76" height="22" rx="11"/></g>
              </g>
            </g>
            <!-- ingredienser som flyger in -->
            <g transform="translate(300 200)"><g id="inSun"><circle r="70" fill="url(#gSun)" stroke="#e7a213" stroke-width="6"/></g></g>
            <g transform="translate(300 850)"><g id="inDrop"><path d="M0 -80c0 0 -52 62 -52 96a52 52 0 0 0 104 0c0-34-52-96-52-96z" fill="var(--water)" stroke="#1d5f93" stroke-width="6"/></g></g>
            <g transform="translate(1640 220)"><g id="inCo2"><line x1="-44" x2="44" stroke="#2c2f35" stroke-width="12"/><circle cx="-50" r="32" fill="var(--o)" stroke="#9e2c1e" stroke-width="5"/><circle r="38" fill="var(--co2)" stroke="#23262b" stroke-width="5"/><circle cx="50" r="32" fill="var(--o)" stroke="#9e2c1e" stroke-width="5"/></g></g>

              <g id="hex2" transform="translate(-160 0)"><path d="M0 -70 L61 -35 L61 35 L0 70 L-61 35 L-61 -35 Z" fill="#ffd28a" stroke="#c46f10" stroke-width="9" stroke-linejoin="round"/></g>
              <g id="hex3" transform="translate(160 0)"><path d="M0 -70 L61 -35 L61 35 L0 70 L-61 35 L-61 -35 Z" fill="#ffd28a" stroke="#c46f10" stroke-width="9" stroke-linejoin="round"/></g>
              <g id="energy" stroke="#f4a915" stroke-width="10" stroke-linecap="round" fill="none">
                <path d="M0 -130 V -190"/><path d="M110 -100 L150 -140"/><path d="M-110 -100 L-150 -140"/><path d="M250 -40 L300 -60"/><path d="M-250 -40 L-300 -60"/>
              </g>
            </g>
          </svg>
          <div id="labSocker" class="pill" style="left:960px; top:780px"><i style="background:var(--sugar)"></i>Socker</div>
          <div id="labEnergi" class="cap" style="left:960px; top:870px; transform:translateX(-50%)">= växtens energi</div>
          <div id="labKok" class="cap" style="left:960px; top:130px; transform:translateX(-50%); color:#2d6e2f; font-size:44px">Inne i bladet</div>

      <!-- ============ AVSLUT: missuppfattningen vänds, sammanfattning ============ -->
      <div id="endClip" class="clip layer" data-start="28" data-duration="8">
        <div id="end" class="full" style="opacity:0; background: var(--paper)">
          <div id="myth" class="big" style="position:absolute; left:50%; top:200px; transform:translateX(-50%); font-size:84px; white-space:nowrap">
            <span id="mythTxt" style="color:var(--muted)">Växten äter jord</span>
            <div id="strike" style="position:absolute; left:-24px; right:-24px; top:52%; height:12px; border-radius:6px; background:#d93a2b; transform-origin:0 50%"></div>
          </div>
          <div id="truth" class="big" style="position:absolute; left:50%; top:360px; transform:translateX(-50%); font-size:84px; white-space:nowrap; color:#2d6e2f">Växten gör sin mat själv</div>
          <div class="eq">
            <div class="tok" id="t1"><svg viewBox="-70 -70 140 140"><circle r="50" fill="url(#gSun)" stroke="#e7a213" stroke-width="6"/></svg>Ljus</div>
            <div class="op" id="p1">+</div>
            <div class="tok" id="t2"><svg viewBox="-70 -70 140 140"><path d="M0 -60c0 0 -40 48 -40 74a40 40 0 0 0 80 0c0-26-40-74-40-74z" fill="var(--water)" stroke="#1d5f93" stroke-width="6"/></svg>Vatten</div>
            <div class="op" id="p2">+</div>
            <div class="tok" id="t3"><svg viewBox="-70 -70 140 140"><line x1="-36" x2="36" stroke="#2c2f35" stroke-width="10"/><circle cx="-40" r="24" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/><circle r="28" fill="var(--co2)" stroke="#23262b" stroke-width="4"/><circle cx="40" r="24" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/></svg>Koldioxid</div>
            <div class="op" id="p3">→</div>
            <div class="tok" id="t4"><svg viewBox="-70 -70 140 140"><path d="M0 -56 L48 -28 L48 28 L0 56 L-48 28 L-48 -28 Z" fill="#ffd28a" stroke="#c46f10" stroke-width="8" stroke-linejoin="round"/></svg>Socker</div>
            <div class="op" id="p4">+</div>
            <div class="tok" id="t5"><svg viewBox="-70 -70 140 140"><circle cx="-18" r="20" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/><circle cx="18" r="20" fill="var(--o)" stroke="#9e2c1e" stroke-width="4"/></svg>Syre</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      gsap.registerPlugin(MotionPathPlugin);
      // Bladets celler: förskjutet rutnät med seedad slump, rundade oregelbundna former (ritas en gång).
      (() => {
        let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const cells = document.getElementById("cells"), NS = "http://www.w3.org/2000/svg";
        for (let r = -1; r < 10; r++) for (let c = -1; c < 13; c++) {
