# Förklaringsfilmer som video (HyperFrames). Varje timme hämtas begrepp som barnen har missat och som saknar video; varje film
# görs i ett eget jobb. Inga hemligheter här: jobben loggar in hos servern med GitHubs OIDC-token, och
# servern (Supabase edge function) anropar Claude och Speko. Se films/render.mjs.
name: Förklaringsfilmer

on:
  # Varje timme: video bara för begrepp som barnen har svarat fel på, högst 3 nya per dygn (se video.ts).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["films/**", ".github/workflows/films.yml"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: films
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      items: ${{ steps.todo.outputs.items }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: todo
        run: node films/render.mjs list

  render:
    needs: plan
    if: needs.plan.outputs.items != '' && needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    defaults:
      run:
        working-directory: films
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: films/package-lock.json
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Webbläsare för HyperFrames
        run: npx hyperframes browser ensure
      - name: Gör filmen
        env:
          QUIZ: ${{ matrix.item.quiz_id }}
          CONCEPT: ${{ matrix.item.concept_id }}
        run: node render.mjs one "$QUIZ" "$CONCEPT"
      - name: Spara kontaktark och logg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            films/work/*-tmp/sheet.jpg
            films/work/*-tmp/poster.jpg
            films/work/*-tmp/info.json
            films/work/*/index.html
          retention-days: 7
          if-no-files-found: ignore

  # Kontaktark, omslagsbilder och kompositioner sparas på grenen film-sheets, så att filmerna kan granskas i efterhand.
  sheets:
    needs: render
    if: always() && needs.render.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sheets
      - name: Spara på grenen film-sheets
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          [ -d sheets ] && [ -n "$(ls -A sheets)" ] || { echo "inga kontaktark"; exit 0; }
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin film-sheets; then git checkout -q -B film-sheets FETCH_HEAD; else git checkout -q --orphan film-sheets; fi
          d="runs/$(date -u +%Y-%m-%d)/${RUN}"; mkdir -p "$d"; cp -r ../sheets/. "$d"/
          git add -A
          git -c user.name="films-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Kontaktark ${RUN}"
          git push -q origin film-sheets
